x-cybersecurity-service: &cybersecurity-service
  image: "${CYBERSECURITY_IMAGE:-rostyslavkrotenko/cybersecurity-smartenergy:latest}"
  platform: linux/amd64
  restart: unless-stopped
  volumes:
    - cybersecurity-data:/work/data/integration
    - cybersecurity-output:/work/out
  networks:
    - default
    - mererza

services:
  obolonka:
    build:
      context: ./obolonka
    ports:
      - "5173:3000"
    environment:
      CYBERSECURITY_API_URL: http://cybersecurity-api:8000/api
    networks:
      - mererza

  backend-service:
    # build: ./backend
    image: dkolodko/diplom-backend:latest
    ports:
      - "6005:8000" 
    restart: always

  backend_troian:
    image: vitaliktroian04/smart-energy-stability:latest
    ports:
      - "6028:8085"
    restart: always

  backend_dosmukhamedov:
    image: xerarobespierre/hybridinvertor-backend-1:latest
    ports:
      - "6050:6050"
    restart: always

  pokazovaSlurzba:
    image: bondarenkorodion/slurzba1
    ports:
      - "3000:3000"
    networks:
      - mererza

  smartenergy-backend:
    image: puvlichok/smartenergy-backend
    ports:
    - "6007:6007"


# [Початок] Монастирний Моніторинг
  influxdb:
    image: influxdb:2-alpine
    ports: ["6029:8086"]
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=secretpassword_smartenergy6
      - DOCKER_INFLUXDB_INIT_ORG=KPI
      - DOCKER_INFLUXDB_INIT_BUCKET=smart_energy
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=secretpassword_smartenergy6

  # MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto.passwd:/mosquitto/config/mosquitto.passwd
      - ./mosquitto.acl:/mosquitto/config/mosquitto.acl
    ports:
      - "6030:1883"
      - "6031:9001"

  # ESP32 Simulator Controller
  simulators:
    image: vicmony/monitoring-monastyrnyi-simulators
    depends_on:
      - mosquitto
    environment:
      - BROKER_URL=mqtt://mosquitto:1883
      - MQTT_USER=simulator
      - MQTT_PASSWORD=simulator_pass
      - CLIENT_ID=ESP32_SIMULATOR
      - SENSOR_DATA_TOPIC=sensor/data
      - SIMULATOR_CONTROL_TOPIC=simulator/control
      - SIMULATOR_STATUS_TOPIC=simulator/status

  # Ingestor (Скрипт, що переписує дані з MQTT в InfluxDB)
  ingestor:
    image: vicmony/monitoring-monastyrnyi-ingestor
    depends_on:
      - influxdb
      - mosquitto
    environment:
      - TZ=Europe/Kyiv
      - MQTT_URL=mqtt://mosquitto:1883
      - MQTT_USER=ingestor
      - MQTT_PASSWORD=ingestor_pass
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=secretpassword_smartenergy6
      - INFLUX_ORG=KPI
      - INFLUX_BUCKET=smart_energy
      - DATA_SAVE_TOPIC=sensor-data

  # History API (Microservice for historical data)
  history-api:
    image: vicmony/monitoring-monastyrnyi-history-api
    ports:
      - "6032:6032"
    depends_on:
      - influxdb
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=secretpassword_smartenergy6
      - INFLUX_ORG=KPI
      - INFLUX_BUCKET=smart_energy
      - PORT=6032
      - DATA_SAVE_TOPIC=sensor-data
# [Кінець] Монастирний Моніторинг


# START Шевченко Анастасія Володимирівна
# Functional Stability

  functional-stability-shevchenko:
    image: mistressmorgana/energy-backend:latest
    ports:
      - "6040:8000"
    restart: unless-stopped

# END Шевченко Анастасія Володимирівна

  backend-kravchenko:
    image: nastensii/smart-energy-backend:latest
    container_name: smart_energy_api_kravchenko
    expose:
      - "8000"
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=secretpassword_smartenergy6
      - MQTT_BROKER=broker.hivemq.com
      - MQTT_PORT=1883

  backend_yaroslav:
    image: yaroslav333/my-backend:latest
    ports:
      - "6001:5000"
    restart: always
    environment:
      - MONGO_URL=mongodb://mongodb:27017/solar_system
    networks:
      - mererza
    depends_on:
      - mongodb
  
  mongodb:
    image: mongo:6
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mererza

  # [Початок] Кротенко — Cybersecurity SmartEnergy

  cybersecurity-gateway:
    <<: *cybersecurity-service
    container_name: cybersecurity-gateway
    command:
      - python
      - -m
      - src.gateway
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --log-level
      - info
    environment:
      GATEWAY_SERVICE_ID: iot-gateway
      GATEWAY_COMPONENT: gateway
      GATEWAY_UPSTREAM_URL: http://backend-kravchenko:8000
      GATEWAY_EVENT_LOG_PATH: /work/data/integration/events.jsonl
      GATEWAY_STATE_PATH: /work/data/integration/state.json
      GATEWAY_CONTROL_TOKEN: "${GATEWAY_CONTROL_TOKEN:?Set GATEWAY_CONTROL_TOKEN in .env}"
      GATEWAY_RATE_PER_SECOND: "${GATEWAY_RATE_PER_SECOND:-25}"
      GATEWAY_BURST_CAPACITY: "${GATEWAY_BURST_CAPACITY:-50}"
      GATEWAY_COMMAND_RATE_PER_MINUTE: "${GATEWAY_COMMAND_RATE_PER_MINUTE:-12}"
      GATEWAY_VIOLATION_THRESHOLD: "${GATEWAY_VIOLATION_THRESHOLD:-8}"
      GATEWAY_VIOLATION_WINDOW_SEC: "${GATEWAY_VIOLATION_WINDOW_SEC:-30}"
      GATEWAY_BLOCK_TTL_SEC: "${GATEWAY_BLOCK_TTL_SEC:-120}"
      GATEWAY_UPSTREAM_TIMEOUT_SEC: "${GATEWAY_UPSTREAM_TIMEOUT_SEC:-3}"
      GATEWAY_CIRCUIT_FAILURE_THRESHOLD: "${GATEWAY_CIRCUIT_FAILURE_THRESHOLD:-5}"
      GATEWAY_CIRCUIT_RECOVERY_TIMEOUT_SEC: "${GATEWAY_CIRCUIT_RECOVERY_TIMEOUT_SEC:-15}"
      GATEWAY_STALE_CACHE_TTL_SEC: "${GATEWAY_STALE_CACHE_TTL_SEC:-30}"
    ports:
      - "6006:8080"
    depends_on:
      backend-kravchenko:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8080/_cybersecurity/healthz
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  cybersecurity-collector:
    <<: *cybersecurity-service
    container_name: cybersecurity-collector
    command:
      - python
      - -m
      - src.collector
    environment:
      COLLECTOR_OUTPUT_PATH: /work/data/integration/collected_events.jsonl
      COLLECTOR_GATEWAY_ENABLED: "true"
      COLLECTOR_GATEWAY_EVENTS_PATH: /work/data/integration/events.jsonl
      COLLECTOR_GATEWAY_CHECKPOINT_PATH: /work/data/integration/gateway-offset.json
      COLLECTOR_HTTP_ENABLED: "true"
      COLLECTOR_HTTP_TARGETS: >-
        gateway-health|gateway|status|http://cybersecurity-gateway:8080/_cybersecurity/healthz
      COLLECTOR_HTTP_TIMEOUT_SEC: "${COLLECTOR_HTTP_TIMEOUT_SEC:-2}"
      COLLECTOR_HTTP_POLL_INTERVAL_SEC: "${COLLECTOR_HTTP_POLL_INTERVAL_SEC:-10}"
      COLLECTOR_MQTT_ENABLED: "true"
      COLLECTOR_MQTT_HOST: mosquitto
      COLLECTOR_MQTT_PORT: "1883"
      COLLECTOR_MQTT_TOPICS: sensor/data
      COLLECTOR_MQTT_QOS: "1"
      COLLECTOR_MQTT_USERNAME: ingestor
      COLLECTOR_MQTT_PASSWORD: ingestor_pass
    depends_on:
      cybersecurity-gateway:
        condition: service_healthy
      mosquitto:
        condition: service_started

  cybersecurity-analyzer:
    <<: *cybersecurity-service
    container_name: cybersecurity-analyzer
    environment:
      ANALYZER_EVENT_CHECKPOINT_PATH: /work/data/integration/checkpoints/analyzer-events.json
      ANALYZER_ACK_CHECKPOINT_PATH: /work/data/integration/checkpoints/analyzer-acks.json
    command:
      - python
      - -m
      - src.analyzer
      - --input
      - /work/data/integration/collected_events.jsonl
      - --watch
      - --poll-interval-ms
      - "1000"
      - --rolling-window-min
      - "5"
      - --out-dir
      - /work/out
      - --policies
      - all
      - --actions-path
      - /work/data/integration/actions.jsonl
      - --applied-path
      - /work/data/integration/actions_applied.jsonl
      - --integration-mode
      - active
      - --log-level
      - INFO
    depends_on:
      cybersecurity-collector:
        condition: service_started

  cybersecurity-control:
    <<: *cybersecurity-service
    container_name: cybersecurity-control
    command:
      - python
      - -m
      - src.control
    environment:
      GATEWAY_CONTROL_URL: http://cybersecurity-gateway:8080
      GATEWAY_CONTROL_TOKEN: "${GATEWAY_CONTROL_TOKEN:?Set GATEWAY_CONTROL_TOKEN in .env}"
      GATEWAY_CONTROL_TIMEOUT_SECONDS: "${GATEWAY_CONTROL_TIMEOUT_SECONDS:-5}"
      CONTROL_ACTIONS_PATH: /work/data/integration/actions.jsonl
      CONTROL_APPLIED_PATH: /work/data/integration/actions_applied.jsonl
      CONTROL_IDEMPOTENCY_PATH: /work/data/integration/control/idempotency.sqlite3
      CONTROL_ACTIONS_CHECKPOINT_PATH: /work/data/integration/checkpoints/control-actions.json
      CONTROL_ISOLATION_SCHEDULE_PATH: /work/data/integration/control/isolation-schedule.json
      CONTROL_GATEWAY_SERVICE_ID: iot-gateway
      CONTROL_POLL_INTERVAL_SEC: "${CONTROL_POLL_INTERVAL_SEC:-0.5}"
      CONTROL_DEFAULT_RATE_PER_SECOND: "${GATEWAY_RATE_PER_SECOND:-25}"
      CONTROL_DEFAULT_BURST_CAPACITY: "${GATEWAY_BURST_CAPACITY:-50}"
      CONTROL_ALLOWED_ISOLATION_COMPONENTS: gateway,api,edge,iot-gateway
    depends_on:
      cybersecurity-gateway:
        condition: service_healthy
      cybersecurity-analyzer:
        condition: service_started

  cybersecurity-api:
    <<: *cybersecurity-service
    container_name: cybersecurity-api
    command:
      - python
      - -m
      - src.api
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      SMARTENERGY_LIVE_MODE: "1"
      CYBERSECURITY_INTEGRATION_MODE: active
      CYBERSECURITY_SNAPSHOT_SOURCE: real-collector
      CYBERSECURITY_EVENTS_PATH: /work/data/integration/collected_events.jsonl
      CYBERSECURITY_EXTERNAL_READS: "true"
      CYBERSECURITY_ADAPTER_TIMEOUT_SEC: "${CYBERSECURITY_ADAPTER_TIMEOUT_SEC:-2}"
      CYBERSECURITY_GATEWAY_URL: >-
        http://cybersecurity-gateway:8080/api/v1/telemetry/latest?limit=50
      CYBERSECURITY_BMS_URL: http://backend-service:8000/api/data
      CYBERSECURITY_INVERTER_URL: http://backend_dosmukhamedov:6050/api/settings
      CYBERSECURITY_TROIAN_URL: http://backend_troian:8085/api/equipment
      CYBERSECURITY_HISTORY_URL: http://history-api:6032/api/status
      CYBERSECURITY_INFLUX_URL: http://influxdb:8086/health
      CYBERSECURITY_MONGO_HOST: mongodb
      CYBERSECURITY_MONGO_PORT: "27017"
      CYBERSECURITY_MQTT_HOST: mosquitto
      CYBERSECURITY_MQTT_WS_PORT: "9001"
      CYBERSECURITY_STABILITY_HOST: functional-stability-shevchenko
      CYBERSECURITY_STABILITY_PORT: "8000"
      CYBERSECURITY_PUBLIC_PORT: "${CYBERSECURITY_API_PORT:-6049}"
      CYBERSECURITY_CORS_ORIGINS: "${CYBERSECURITY_CORS_ORIGINS:-http://localhost:5173,http://0.0.0.0:5173}"
    ports:
      - "${CYBERSECURITY_API_PORT:-6049}:8000"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8000/healthz
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      cybersecurity-analyzer:
        condition: service_started

  # [Кінець] Кротенко — Cybersecurity SmartEnergy

networks:
  default:
    driver: bridge

  mererza:
    driver: bridge

volumes:
  influxdb_data: # оголошено том для всього проєкту
  mongo_data:

  cybersecurity-data:
    name: smartenergy-cybersecurity-data

  cybersecurity-output:
    name: smartenergy-cybersecurity-output
